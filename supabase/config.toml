project_id = "kw-sports-player-needs"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]

[db]
# Matches the production project (Postgres 17).
major_version = 17

[db.seed]
enabled = true
# Clubs first: the example needs in seed.sql reference them.
sql_paths = ["./clubs-2026-27.sql", "./seed.sql"]
