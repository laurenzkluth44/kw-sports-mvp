# One-off: updates dependencies on a deps/* branch (npm is not reachable from the dev sandbox).
# Runs npm update (within the version ranges) and npm audit fix, then commits the lockfile back.
name: Dependency update
on:
  push:
    branches: ["deps/**", "chore/deps-update"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit before
        run: npm audit --omit=dev || true
      - name: Update
        run: |
          npm install --no-audit --no-fund
          npm update --no-audit --no-fund
          npm audit fix --no-fund || true
      - name: Audit after
        run: |
          npm audit || true
          echo '### npm audit after update' >> "$GITHUB_STEP_SUMMARY"
          npm audit 2>&1 | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit
        run: |
          if git diff --quiet; then echo "nothing to update"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update dependencies (npm update + npm audit fix)"
          git push
